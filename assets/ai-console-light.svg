<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-labelledby="title desc">
  <title id="title">AI console interface in light theme</title>
  <desc id="desc">A light interface with code lines and connected AI nodes.</desc>
  <defs>
    <linearGradient id="screen" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eaf5f2"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#087f72"/>
      <stop offset="1" stop-color="#296fd6"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="640" height="330" rx="18" fill="url(#screen)" stroke="rgba(7,17,19,.12)"/>
  <rect x="28" y="28" width="584" height="274" rx="14" fill="#f8fbf9" stroke="rgba(7,17,19,.13)"/>
  <circle cx="54" cy="54" r="6" fill="#e06d65"/>
  <circle cx="76" cy="54" r="6" fill="#c28b2d"/>
  <circle cx="98" cy="54" r="6" fill="#087f72"/>
  <g fill="none" stroke="rgba(8,127,114,.14)">
    <path d="M64 112h236M64 150h186M64 188h260M64 226h214M64 264h156"/>
    <path d="M368 126c44-48 111-39 146 8M370 206c54 40 105 29 154-34M384 286c30-38 91-46 138-20"/>
  </g>
  <g font-family="JetBrains Mono, Consolas, monospace" font-size="18" font-weight="700">
    <text x="64" y="118" fill="#087f72">const product = shape(user.intent)</text>
    <text x="64" y="156" fill="#0e1a1d">compose(component.system)</text>
    <text x="64" y="194" fill="#296fd6">add(ai.assistance)</text>
    <text x="64" y="232" fill="#526468">refine(interaction.detail)</text>
    <text x="64" y="270" fill="#087f72">ship(reliable.experience)</text>
  </g>
  <g filter="url(#glow)">
    <circle cx="470" cy="148" r="48" fill="rgba(8,127,114,.08)" stroke="url(#accent)" stroke-width="3"/>
    <circle cx="405" cy="252" r="34" fill="rgba(41,111,214,.08)" stroke="#296fd6" stroke-width="3"/>
    <circle cx="538" cy="274" r="42" fill="rgba(8,127,114,.07)" stroke="#087f72" stroke-width="3"/>
    <circle cx="472" cy="148" r="7" fill="#087f72"/>
    <circle cx="405" cy="252" r="6" fill="#296fd6"/>
    <circle cx="538" cy="274" r="7" fill="#087f72"/>
  </g>
</svg>
