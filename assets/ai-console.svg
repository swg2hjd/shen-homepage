<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-labelledby="title desc">
  <title id="title">AI console interface</title>
  <desc id="desc">A stylized dark interface with code lines, metrics, and connected AI nodes.</desc>
  <defs>
    <linearGradient id="screen" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#162832"/>
      <stop offset="1" stop-color="#081014"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#57f2d7"/>
      <stop offset="1" stop-color="#67a7ff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="640" height="330" rx="18" fill="url(#screen)"/>
  <rect x="28" y="28" width="584" height="274" rx="14" fill="#0c171d" stroke="rgba(237,247,245,.14)"/>
  <circle cx="54" cy="54" r="6" fill="#ff6b6b"/>
  <circle cx="76" cy="54" r="6" fill="#ffd166"/>
  <circle cx="98" cy="54" r="6" fill="#57f2d7"/>
  <g fill="none" stroke="rgba(87,242,215,.16)">
    <path d="M64 112h236M64 150h186M64 188h260M64 226h214M64 264h156"/>
    <path d="M368 126c44-48 111-39 146 8M370 206c54 40 105 29 154-34M384 306c30-58 91-66 138-20"/>
  </g>
  <g font-family="JetBrains Mono, Consolas, monospace" font-size="18" font-weight="700">
    <text x="64" y="118" fill="#57f2d7">const product = shape(user.intent)</text>
    <text x="64" y="156" fill="#edf7f5">compose(component.system)</text>
    <text x="64" y="194" fill="#67a7ff">add(ai.assistance)</text>
    <text x="64" y="232" fill="#9fb5b2">refine(interaction.detail)</text>
    <text x="64" y="270" fill="#57f2d7">ship(reliable.experience)</text>
  </g>
  <g filter="url(#glow)">
    <circle cx="470" cy="148" r="48" fill="rgba(87,242,215,.10)" stroke="url(#accent)" stroke-width="3"/>
    <circle cx="405" cy="252" r="34" fill="rgba(103,167,255,.12)" stroke="#67a7ff" stroke-width="3"/>
    <circle cx="538" cy="274" r="42" fill="rgba(87,242,215,.08)" stroke="#57f2d7" stroke-width="3"/>
    <circle cx="472" cy="148" r="7" fill="#57f2d7"/>
    <circle cx="405" cy="252" r="6" fill="#67a7ff"/>
    <circle cx="538" cy="274" r="7" fill="#57f2d7"/>
  </g>
</svg>
